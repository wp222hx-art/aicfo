<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AiCFO — Your AI-First Corporate Brain in Singapore</title>
<link rel="stylesheet" href="/styles/app.css" />
</head>
<body>
<div id="app">
  <!-- Top Bar -->
  <header class="topbar">
    <div class="brand" onclick="nav('dashboard')">
      <div class="logo">Ai</div>
      <div>
        <div class="brand-name">AiCFO</div>
        <div class="brand-tag" data-i18n="brand.tag">Corporate Brain · Singapore</div>
      </div>
    </div>
    <nav class="nav">
      <a data-route="dashboard" data-i18n="nav.dashboard" onclick="nav('dashboard')">Dashboard</a>
      <a data-route="register" data-i18n="nav.register" onclick="nav('register')">Register</a>
      <a data-route="books" data-i18n="nav.books" onclick="nav('books')">Books</a>
      <a data-route="reports" data-i18n="nav.reports" onclick="nav('reports')">Reports</a>
      <a data-route="monthly" data-i18n="nav.monthly" onclick="nav('monthly')">Monthly</a>
      <a data-route="tax" data-i18n="nav.tax" onclick="nav('tax')">Tax</a>
      <a data-route="secretary" data-i18n="nav.secretary" onclick="nav('secretary')">Secretary</a>
      <a data-route="chat" data-i18n="nav.chat" onclick="nav('chat')">AI Chat</a>
      <a data-route="pricing" data-i18n="nav.pricing" onclick="nav('pricing')">Pricing</a>
      <div style="margin:8px 14px;border-top:1px solid rgba(255,255,255,0.15)"></div>
      <a data-route="signup" onclick="nav('signup')">🚀 注册</a>
      <a data-route="plans" onclick="nav('plans')">💳 选套餐 / 支付</a>
      <a data-route="wa" onclick="nav('wa')">📱 我的 WhatsApp 渠道</a>
      <a data-route="myArchive" onclick="nav('myArchive')" style="background:linear-gradient(90deg,rgba(16,185,129,0.15),transparent);font-weight:600">📚 我的企业档案</a>
    </nav>
    <button class="lang-toggle" id="langToggle" onclick="I18N.toggleLocale()" title="Switch language / 切换语言">
      <span>🌐</span> <span id="langLabel" data-i18n="lang.toggle">中文</span>
    </button>
    <div class="user-chip" id="userChip">
      <span class="avatar">JC</span>
      <div>
        <div class="user-name" id="userName">James Chen</div>
        <div class="user-role" id="userRole">Skyhawk Innovate Pte Ltd</div>
      </div>
      <a class="admin-link" href="/admin/" data-i18n="nav.admin">Admin →</a>
    </div>
  </header>

  <main id="view"></main>
</div>
<script src="/assets/i18n.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
